# Generated by release-cascade.py --regenerate from the top repos' Cargo.lock files.
# Re-run it to refresh; manual edits are overwritten.
name: v5
steps:
  - repo: hopr-types
    branch: main
    workflow: release.yaml
    crates: [hopr-types]
  - repo: blokli-client
    branch: main
    workflow: release-library.yaml
    crates: [blokli-client]
  - repo: hopr-api
    branch: main
    workflow: release.yaml
    crates: [hopr-api]
  - repo: hopr-utilities
    branch: main
    workflow: release-library.yaml
    crates: [hopr-utilities]
  - repo: hopr-impls
    branch: main
    workflow: release.yaml
    crates: [hopr-chain-connector, hopr-ct-full-network, hopr-network-graph, hopr-session-server-forwarder, hopr-ticket-manager, hopr-transport-p2p]
  - repo: hopr-strategy
    branch: main
    workflow: release-library.yaml
    crates: [hopr-strategy]
# published elsewhere: the plan only checks they are on crates.io (not yanked)
fixed:
  - {crate: hopr-bindings, version: "5.2.0", repo: unknown}
# repinned by hand once the steps are published
downstream:
  - {repo: edge-client, branch: main}
  - {repo: hoprd, branch: main}
