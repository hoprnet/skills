name: Test hopr-release
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
concurrency:
  group: test-hopr-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  unit:
    name: Unit (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"  # the minimum: tomllib
          - "3.12"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the release-cascade tests
        run: python3 -I tools/hopr-release/scripts/test_release_cascade.py
